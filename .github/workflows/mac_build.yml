name: macOS App Build

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Compile SoftEther VPN
      run: make main
      
    - name: Compile and Package UI
      run: make ui
      
    - name: Zip the App Bundle
      run: |
        ditto -c -k --keepParent SoftEtherUI.app SoftEtherUI-macOS.zip
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SoftEtherUI-macOS
        path: SoftEtherUI-macOS.zip
