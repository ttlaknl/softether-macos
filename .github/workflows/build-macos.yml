name: Build macOS Binary (Native ARM64)

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest  # Now it's ARM64 (Apple Silicon)

    steps:
    - name: Checkout SoftEtherVPN Official Source
      uses: actions/checkout@v4
      with:
        repository: SoftEtherVPN/SoftEtherVPN
        submodules: recursive
        fetch-depth: 1

    - name: Install dependencies
      run: |
        brew update
        brew install cmake openssl libsodium readline ncurses

    - name: Configure and Build
      run: |
        # Use the provided configure script which calls CMake
        ./configure
        make -C build

    - name: Check build artifacts
      run: |
        ls -l build/vpnclient build/vpncmd build/hamcore.se2
        file build/vpnclient
        if [ ! -f build/vpnclient ] || [ ! -f build/vpncmd ]; then
          echo "Error: Binaries were not generated properly."
          exit 1
        fi

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: macos-vpn-arm64-native
        path: |
          build/vpnclient
          build/vpncmd
          build/hamcore.se2
